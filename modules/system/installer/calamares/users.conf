defaultGroups:
  - users
  - networkmanager
  - wheel

setRootPassword: false
doReusePassword: false
doAutologin: false

passwordRequirements:
  minLength: 8
  maxLength: 64
  libpwquality:
    - minlen=8
    - maxrepeat=3
    - maxsequence=3
    - usersubstr=4
    - badwords=linux

allowWeakPasswords: true
allowWeakPasswordsDefault: false

presets:
  fullName: "Solavane"
  loginName: "solavane"

user:
  shell: /run/current-system/sw/bin/bash
  forbidden_names: [ root ]

hostname:
  location: EtcHostname
  writeHostsFile: false
  forbidden_names: [ localhost ]
