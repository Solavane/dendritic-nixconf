---
modules-search: [ local, @out@/lib/calamares/modules ]

instances:
- id: host
  module: packagechooser
  config: host.conf
- id: disk
  module: packagechooser
  config: disk.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - packagechooser@host
  - packagechooser@disk
  - summary
- exec:
  - flake-installer
  - umount
- show:
  - finished

branding: nixos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
